[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zon"
version = "0.0.1"
description = "ZON — runtime of HORIZON 247"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pyyaml>=6", "hori"]
license = { file = "LICENSE" }

[project.optional-dependencies]
earthdata = ["earthaccess"]
netcdf = ["netCDF4", "h5py"]
dev = ["pytest"]

# install the sibling package in editable mode:  pip install -e ../hori -e .

[tool.setuptools.packages.find]
where = ["src"]
